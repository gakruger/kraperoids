<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kraperoids</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
        color: #fff;
      }
      canvas {
        display: block;
      }

      #lobby {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        min-width: 320px;
      }
      @keyframes glow {
        0%,
        100% {
          text-shadow:
            0 0 8px #8af,
            0 0 20px #4af;
        }
        50% {
          text-shadow:
            0 0 16px #8af,
            0 0 40px #4af,
            0 0 60px #4af;
        }
      }
      #lobby h1 {
        font-size: 46px;
        margin-bottom: 20px;
        letter-spacing: 6px;
        animation: glow 3s ease-in-out infinite;
      }
      #lobby .btn {
        display: inline-block;
        padding: 12px 32px;
        font-size: 16px;
        font-family: "Courier New", monospace;
        background: #fff;
        color: #000;
        border: none;
        cursor: pointer;
        margin: 6px;
        transition:
          box-shadow 0.2s,
          background 0.2s,
          transform 0.1s;
      }
      #lobby .btn:hover {
        background: #eee;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      }
      #lobby .btn:active {
        transform: scale(0.97);
      }
      #lobby .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #lobby input {
        padding: 10px 16px;
        font-size: 20px;
        font-family: "Courier New", monospace;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
        background: #111;
        color: #fff;
        border: 2px solid #444;
        outline: none;
        width: 160px;
      }
      #lobby input:focus {
        border-color: #888;
      }
      #lobby .row {
        margin: 10px 0;
      }
      #lobby .code {
        font-size: 32px;
        letter-spacing: 8px;
        color: #4f4;
        margin: 10px 0;
      }
      #lobby .players {
        margin: 10px 0;
        font-size: 14px;
        color: #888;
      }
      #lobby .players span {
        display: inline-block;
        margin: 4px 8px;
        padding: 4px 12px;
        background: #222;
        border-radius: 4px;
      }
      #lobby .err {
        color: #f44;
        font-size: 13px;
        margin: 6px 0;
        min-height: 18px;
      }
      #lobby .room-list {
        margin: 10px auto;
        max-height: 150px;
        overflow-y: auto;
        width: 260px;
      }
      #lobby .room-list::-webkit-scrollbar {
        width: 4px;
      }
      #lobby .room-list::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 2px;
      }
      #lobby .room-entry {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        margin: 4px 0;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s;
      }
      #lobby .room-entry:hover {
        background: #222;
        border-color: #555;
      }
      #lobby .room-entry .code {
        letter-spacing: 4px;
        color: #fff;
        font-size: 16px;
      }
      #lobby .room-entry .meta {
        color: #888;
        font-size: 12px;
      }
      #lobby .room-entry.full {
        opacity: 0.4;
        cursor: default;
      }
      #lobby .room-entry.full:hover {
        background: #111;
        border-color: #333;
      }
      #lobby .no-rooms {
        color: #555;
        font-size: 13px;
        margin: 8px 0;
      }
      #lobby .hitcount {
        position: fixed;
        bottom: 12px;
        right: 16px;
        font-size: 12px;
        color: #444;
      }

      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #score {
        position: absolute;
        top: 16px;
        left: 16px;
        font-size: 18px;
      }
      #lives {
        position: absolute;
        top: 16px;
        right: 16px;
        font-size: 18px;
      }
      #players-ui {
        position: absolute;
        top: 44px;
        left: 16px;
        font-size: 13px;
        color: #888;
      }
      #players-ui span {
        margin-right: 10px;
      }
      #players-ui .you {
        color: #fff;
        font-weight: bold;
      }

      #over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        pointer-events: all;
      }
      #over h1 {
        font-size: 42px;
        margin-bottom: 10px;
        cursor: pointer;
        user-select: none;
      }
      #over .scores {
        margin: 10px 0 20px;
        font-size: 16px;
      }
      #over .scores div {
        margin: 4px 0;
      }
      #over .scores .me {
        color: #4f4;
      }
      #over button {
        pointer-events: all;
        padding: 12px 32px;
        font-size: 18px;
        font-family: "Courier New", monospace;
        background: #fff;
        color: #000;
        border: none;
        cursor: pointer;
      }
      #over button:hover {
        background: #ccc;
      }

      #crt {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 999;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.08) 0px,
          rgba(0, 0, 0, 0.08) 1px,
          transparent 1px,
          transparent 3px
        );
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>KRAPEROIDS</h1>
      <div class="row"><button class="btn" id="createBtn">Create Room</button></div>
      <div class="row">— or —</div>
      <div class="row"><input id="joinInput" placeholder="ROOM CODE" maxlength="4" /></div>
      <div class="row"><button class="btn" id="joinBtn">Join Room</button></div>
      <div class="row"><button class="btn" id="refreshBtn">Refresh Rooms</button></div>
      <div class="room-list" id="roomList"></div>
      <div class="err" id="err"></div>
      <div id="roomInfo" style="display: none">
        <div class="code" id="roomCode"></div>
        <div class="players" id="playerList"></div>
        <button class="btn" id="startBtn" style="display: none">Start Game</button>
        <button class="btn" id="leaveBtn">Leave</button>
      </div>
      <div class="hitcount"><span id="hits">0</span> unique visitors</div>
    </div>

    <div id="ui" style="display: none">
      <div id="score">Score: 0</div>
      <div id="players-ui"></div>
      <div id="lives"></div>
      <div id="over">
        <h1>HONK!</h1>
        <div class="scores" id="finalScores"></div>
        <button id="backBtn">Back to Lobby</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="game.js"></script>
  </body>
</html>
